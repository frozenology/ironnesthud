name: Build and Release Electron App

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ./hud
        
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci
      - name: Compile Electron App
        uses: x6Pnda/action-electron-compiler@v1
        with:
            # GitHub token, automatically provided to the action
            # (Optional)
            github_token: ${{ secrets.github_token }}

            # If the commit is tagged with a version (e.g. "v1.0.0"),
            # (Optional)
            release: ${{ startsWith(github.ref, 'refs/tags/v') }}

            # Package manager. NPM, PNPM and Yarn supported. Install Yarn and PNPM yourself. Default is NPM
            # (Optional)
            package_manager: NPM

            # Skip buiding the application
            # (Optional)
            skip_build: false
